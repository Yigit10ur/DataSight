# Production stack: Caddy is the only service reachable from outside. It serves
# HTTPS for DATASIGHT_DOMAIN, sends /api/* to the backend and everything else to
# the frontend. Configure it in .env next to this file (see .env.example).

# Docker keeps container logs forever by default, and a long-running server fills
# its disk with them. Each service keeps at most 5 files of 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build: ./backend
    environment:
      DATASIGHT_CORS_ORIGINS: '["https://${DATASIGHT_DOMAIN:?set DATASIGHT_DOMAIN in .env}"]'
      DATASIGHT_API_DOCS: "false"
      DATASIGHT_SECURE_COOKIES: "true"
      DATASIGHT_MAX_UPLOAD_BYTES: ${DATASIGHT_MAX_UPLOAD_BYTES:-26214400}
      DATASIGHT_MAX_DATASETS: ${DATASIGHT_MAX_DATASETS:-40}
      # Kept datasets plus the jobs in flight must fit DATASIGHT_BACKEND_MEMORY. With
      # 2 GB: about 150 MB for the process, up to ~500 MB for each of two jobs on a
      # maximum-size file, and 640 MB for the datasets themselves.
      DATASIGHT_MAX_STORE_BYTES: ${DATASIGHT_MAX_STORE_BYTES:-671088640}
      DATASIGHT_MAX_CONCURRENT_JOBS: ${DATASIGHT_MAX_CONCURRENT_JOBS:-2}
      DATASIGHT_MAX_WORKBOOK_BYTES: ${DATASIGHT_MAX_WORKBOOK_BYTES:-134217728}
      # One account's share, so a single sign-up cannot fill the store for everyone.
      DATASIGHT_MAX_USER_STORE_BYTES: ${DATASIGHT_MAX_USER_STORE_BYTES:-167772160}
      DATASIGHT_MAX_DATASETS_PER_USER: ${DATASIGHT_MAX_DATASETS_PER_USER:-10}
      DATASIGHT_DATASET_TTL_SECONDS: ${DATASIGHT_DATASET_TTL_SECONDS:-3600}
    # Uploads are spooled to /tmp while they arrive; its size caps that disk use.
    read_only: true
    tmpfs:
      - /tmp:size=512m
    # Accounts and sessions. Datasets stay in memory; this is all that persists.
    volumes:
      - datasight_data:/data
    mem_limit: ${DATASIGHT_BACKEND_MEMORY:-2g}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  frontend:
    build: ./frontend
    read_only: true
    tmpfs:
      - /app/.next/cache:uid=1000,gid=1000,size=64m
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging

  caddy:
    build:
      context: ./deploy
      dockerfile: Caddy.Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DATASIGHT_DOMAIN: ${DATASIGHT_DOMAIN}
      # The upload limit plus room for the multipart envelope around the file.
      DATASIGHT_PROXY_MAX_UPLOAD: ${DATASIGHT_PROXY_MAX_UPLOAD:-26MiB}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  datasight_data:
  caddy_data:
  caddy_config:
