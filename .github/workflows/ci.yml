name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Builds the production images and starts them the way compose.yaml does, so a
  # broken Dockerfile or proxy config fails here rather than on the server.
  images:
    runs-on: ubuntu-latest
    env:
      DATASIGHT_DOMAIN: ci.invalid
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      # --wait returns once both services report healthy, and fails if either does not.
      - run: docker compose up --detach --wait --wait-timeout 120 backend frontend
      # Signing up writes the accounts database, which proves the /data volume is
      # writable by the backend's user inside its otherwise read-only container.
      - run: >-
          docker compose exec -T backend python -c "import json, urllib.request;
          request = urllib.request.Request('http://127.0.0.1:8000/api/auth/signup',
          data=json.dumps({'username': 'ci-check', 'password': 'ci-password'}).encode(),
          headers={'Content-Type': 'application/json'});
          assert urllib.request.urlopen(request).status == 201"
      - run: docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
